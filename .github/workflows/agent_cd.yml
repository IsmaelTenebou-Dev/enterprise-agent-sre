name: SRE Agent CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install platform dependencies
      run: |
        python -m pip install --upgrade pip
        pip install langgraph langgraph-checkpoint-postgres mcp psycopg psycopg-pool requests fastapi uvicorn pyyaml
        
    - name: Run SRE Assertion Evaluation Suite
      run: |
        python eval_suite.py
