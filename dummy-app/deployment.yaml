apiVersion: apps/v1
kind: Deployment
metadata:
  name: faulty-service
  namespace: default
  labels:
    app: faulty-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faulty-service
  template:
    metadata:
      labels:
        app: faulty-service
    spec:
      containers:
      - name: web
        image: localhost:5001/dummy-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: faulty-service
  namespace: default
spec:
  selector:
    app: faulty-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
